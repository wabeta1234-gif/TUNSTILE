version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: development
      PORT: 8000
      THREAD: 2
      HEADLESS: "true"
      BROWSER_TYPE: chromium
      API_HOST: 0.0.0.0
      API_PORT: 8000
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
